<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" preserveAspectRatio="none">
	<defs>
		<filter id="lgrain">
			<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" result="n"/>
			<feColorMatrix in="n" type="matrix"
				values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0"/>
		</filter>
		<linearGradient id="cream" x1="0" y1="0" x2="0.6" y2="1">
			<stop offset="0" stop-color="#fcf7ee"/>
			<stop offset="0.55" stop-color="#f4ecdb"/>
			<stop offset="1" stop-color="#e8dbc4"/>
		</linearGradient>
		<radialGradient id="pit" cx="0.5" cy="0.44" r="0.6">
			<stop offset="0" stop-color="#2c2a22" stop-opacity="0.3"/>
			<stop offset="0.55" stop-color="#2c2a22" stop-opacity="0.07"/>
			<stop offset="1" stop-color="#2c2a22" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="topsh" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#22201a" stop-opacity="0.32"/>
			<stop offset="1" stop-color="#22201a" stop-opacity="0"/>
		</linearGradient>
	</defs>

	<rect width="400" height="440" fill="url(#cream)"/>
	<rect width="400" height="440" filter="url(#lgrain)" opacity="0.07"/>
	<rect width="400" height="440" fill="url(#pit)"/>
	<rect width="400" height="96" fill="url(#topsh)"/>
</svg>
